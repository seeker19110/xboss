name: "🎯 Mục tiêu lớn"
description: Khởi tạo Goal nhiều milestone/PR với metric và checkpoint
title: "goal: "
labels: ["type: goal", "status: framing"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome và vai trò người dùng
    validations: { required: true }
  - type: textarea
    id: metrics
    attributes:
      label: Baseline, target, cửa sổ đo và guardrails
    validations: { required: true }
  - type: textarea
    id: complete
    attributes:
      label: Definition of Goal Complete
      description: Tiêu chí có thể xác minh, không dùng “code xong”.
    validations: { required: true }
  - type: textarea
    id: scope
    attributes:
      label: Scope và non-goals
    validations: { required: true }
  - type: checkboxes
    id: authority
    attributes:
      label: Quyền cấp cho AI
      options:
        - label: Research và viết spec
        - label: Tạo branch và draft PR
        - label: Chuyển Ready for review
        - label: Merge sau required checks
        - label: Deploy/thay đổi production
  - type: textarea
    id: stop
    attributes:
      label: Quyết định/điều kiện phải dừng
    validations: { required: true }
