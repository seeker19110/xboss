name: Lighthouse CI

# Đo hiệu năng/a11y/best-practices/SEO trên /login (xem lighthouserc.json).
# Chặn merge: cả 4 category đều assertion 'error' (đo thật 2026-07-06, dư nhiều ngưỡng).
#
# Chạy CẢ trên push main, không chỉ PR (đóng nợ kỹ thuật đợt audit 2026-09-05): commit vào
# main không qua PR — hoặc hồi quy chỉ lộ ra sau khi gộp hai PR xanh — trước đây không có
# cổng hiệu năng nào bắt được.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege: workflow chỉ cần đọc code, không cần ghi gì lên GitHub.
permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://x:x@127.0.0.1:5432/x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Chạy Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun
