name: Lighthouse CI

# Đo hiệu năng/a11y/best-practices/SEO trên /login mỗi PR (xem lighthouserc.json).
# Chặn merge: cả 4 category đều assertion 'error' (đo thật 2026-07-06, dư nhiều ngưỡng).
on:
  pull_request:
    branches: [main]

# Least-privilege: workflow chỉ cần đọc code, không cần ghi gì lên GitHub.
permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://x:x@127.0.0.1:5432/x
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Chạy Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun
