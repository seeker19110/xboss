name: Lighthouse CI

# Đo BASELINE hiệu năng/a11y/SEO trên /login mỗi PR (xem lighthouserc.json).
# Hiện không chặn merge (assertion 'warn' + continue-on-error) — đo để cải thiện dần.
on:
  pull_request:
    branches: [main]

# Least-privilege: workflow chỉ cần đọc code, không cần ghi gì lên GitHub.
permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://x:x@127.0.0.1:5432/x
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Chạy Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun
        continue-on-error: true
