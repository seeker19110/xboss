name: Lighthouse CI

# Đo hiệu năng/a11y/best-practices/SEO trên /login mỗi PR (xem lighthouserc.json).
# Chặn merge: cả 4 category đều assertion 'error' (đo thật 2026-07-06, dư nhiều ngưỡng).
on:
  pull_request:
    branches: [main]

# Least-privilege: workflow chỉ cần đọc code, không cần ghi gì lên GitHub.
permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://x:x@127.0.0.1:5432/x
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Chạy Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun
