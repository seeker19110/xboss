name: QUALITY lock repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/quality-lock-repair.yml

permissions:
  contents: read

concurrency:
  group: quality-lock-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/quality-final-dependency-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Dựng lockfile bằng npm, không chạy lifecycle script
        run: |
          cp package-lock.json /tmp/xboss-lock-before.json
          npm update source-map-js sharp --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Chỉ chấp nhận hai dependency và binary sharp liên quan
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const before = JSON.parse(fs.readFileSync('/tmp/xboss-lock-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          assert.equal(before.packages['node_modules/source-map-js'].version, '1.2.1');
          assert.equal(after.packages['node_modules/source-map-js'].version, '1.2.2');
          assert.equal(after.packages['node_modules/sharp'].version, '0.35.5');
          const allowed = /^node_modules\/(?:source-map-js|sharp|@img\/sharp-[a-z0-9-]+)$/;
          const paths = new Set([...Object.keys(before.packages), ...Object.keys(after.packages)]);
          for (const path of paths) {
            if (!allowed.test(path)) continue;
            const replacement = after.packages[path];
            assert.ok(replacement && before.packages[path], 'Không thêm/xóa package');
            if (JSON.stringify(replacement) !== JSON.stringify(before.packages[path])) {
              assert.ok(replacement.resolved.startsWith('https://registry.npmjs.org/'));
              assert.match(replacement.integrity, /^sha512-[A-Za-z0-9+/]+={0,2}$/);
              console.log('LOCK_CHANGE', path, before.packages[path].version, replacement.version);
            }
            after.packages[path] = before.packages[path];
          }
          assert.deepEqual(after, before, 'Từ chối cập nhật ngoài dependency đã duyệt');
          console.log('LOCK_SCOPE_PASS');
          NODE
          git diff --check
          git diff --stat
      - name: Kiểm npm ci và audit trên lockfile mới
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high --fetch-timeout=30000
          node -e "const s=require('sharp'); console.log('SHARP_RUNTIME', JSON.stringify(s.versions))"
      - name: Lưu blob ứng viên, không sửa branch hoặc production
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const root = 'https://api.github.com/repos/seeker19110/xboss';
          const headers = {
            authorization: `Bearer ${process.env.GH_TOKEN}`,
            accept: 'application/vnd.github+json',
            'content-type': 'application/json',
            'x-github-api-version': '2022-11-28'
          };
          const branch = 'fix/quality-final-dependency-20261006';
          const ref = await fetch(`${root}/git/ref/heads/${branch}`, { headers });
          assert.ok(ref.ok, 'Không đọc được HEAD');
          assert.equal((await ref.json()).object.sha, process.env.SOURCE_SHA,
            'HEAD đã thay đổi; không sử dụng kết quả cũ');
          const note = [
            '## 2026-10-06 — QUALITY-FINAL-1: vá dependency chặn CI',
            '',
            'Cập nhật source-map-js lên 1.2.2 (GHSA-68fv-2mgg-jv7q) và sharp lên 0.35.5',
            '(GHSA-wq5f-xc86-pv6w), gồm các binary sharp/libvips đi kèm; không nâng package khác.',
            'Lockfile được npm dựng trên Node 24; kiểm phạm vi, npm ci với ignore-scripts,',
            'audit production và nạp sharp đạt trên ứng viên. Full CI/review trên commit',
            'tích hợp vẫn bắt buộc; không coi đây là nghiệm thu production hoặc toàn bộ 54 AC.',
            'Tiếp tục QUALITY-FINAL-1 và sổ nợ #572. #571 cùng credential migrator trên VPS',
            'còn là điều kiện riêng. Không hạ cổng, đổi schema hoặc bật offline queue.',
            '',
            ''
          ].join('\n');
          const progress = fs.readFileSync('PROGRESS.md', 'utf8');
          assert.ok(progress.startsWith('# PROGRESS — XBoss\n\n'));
          const updated = progress.replace('# PROGRESS — XBoss\n\n',
            '# PROGRESS — XBoss\n\n' + note);
          for (const [path, content] of [
            ['package-lock.json', fs.readFileSync('package-lock.json', 'utf8')],
            ['PROGRESS.md', updated]
          ]) {
            const response = await fetch(`${root}/git/blobs`, {
              method: 'POST', headers,
              body: JSON.stringify({ content, encoding: 'utf-8' })
            });
            assert.ok(response.ok, `Không lưu được blob ${path}: ${response.status}`);
            const result = await response.json();
            console.log('CANDIDATE_BLOB', path, result.sha, 'SOURCE', process.env.SOURCE_SHA);
          }
          NODE
