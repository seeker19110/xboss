name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: workflow chỉ cần đọc code, không cần ghi gì lên GitHub.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Postgres riêng cho test tích hợp (recompute.test.ts cần TEST_DATABASE_URL).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: xboss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Kiểm tra lỗ hổng dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Cổng M52 PR3: swExclude khai trong module registry (lib/modules.ts) phải khớp
      # danh sách loại trừ cache thật trong public/sw.js — lệch là đỏ. Static, không cần DB.
      - name: Kiểm swExclude registry khớp sw.js
        run: npm run check:sw-exclude

      # "npm test" chạy từng file test trong 1 process Node riêng, tuần tự (xem
      # scripts/run-tests.mjs) — cô lập để nhiều file cùng chạm 1 Postgres CI không đụng
      # nhau gây fail ngẫu nhiên. Cùng lệnh với chạy test cục bộ (local === CI).
      - name: Test (kèm test tích hợp trên Postgres)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/xboss_test

      # ERD sinh tự động từ schema thật (M45 PR3): Postgres CI đã có đủ schema sau
      # bước Test (ensureSchema áp mọi migration). Lệch docs/ERD.md → CI đỏ.
      - name: Kiểm ERD khớp schema
        run: |
          npm run gen:erd
          git diff --exit-code docs/ERD.md
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/xboss_test

      - name: Build
        run: npm run build
        env:
          # Build không kết nối DB (Pool khởi tạo lazy) — chỉ cần biến tồn tại.
          DATABASE_URL: postgres://ci:ci@localhost:5432/xboss_test

  # Gộp chung workflow "CI" với job `ci` ở trên (thay vì workflow "E2E" riêng) để
  # deploy.yml (workflow_run: workflows: ["CI"]) chỉ coi là success khi CẢ HAI job
  # đều pass — trước đây E2E là workflow độc lập chạy song song, deploy có thể
  # trigger ngay cả khi E2E đang fail/chưa xong (đã bắt được ở đợt audit 2026-07-12).
  e2e:
    runs-on: ubuntu-latest

    # Postgres test cho nhánh sau-auth (seed dữ liệu mẫu + tạo admin khi login).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: xboss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # E2E_DATABASE_URL bật nhánh sau-auth (mirror quy ước TEST_DATABASE_URL của test tích hợp).
      E2E_DATABASE_URL: postgres://ci:ci@localhost:5432/xboss_test
      # DATABASE_URL cho bước build (pool lazy — chỉ cần biến tồn tại).
      DATABASE_URL: postgres://ci:ci@localhost:5432/xboss_test
      # Secret ký phiên (production) + mật khẩu admin tạo lần đầu — giá trị test, DB ephemeral.
      # gitleaks:allow — không phải secret thật (biến tên có "SECRET" nên generic-api-key báo nhầm).
      XBOSS_SECRET: e2e-ci-secret-khong-bi-mat # gitleaks:allow
      XBOSS_ADMIN_PASSWORD: e2e-ci-admin-pw # gitleaks:allow

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Cài trình duyệt Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Chạy E2E (desktop + mobile, gồm nhánh sau đăng nhập)
        run: npm run test:e2e

      - name: Lưu báo cáo khi lỗi
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
