name: OpenSSF Scorecard

# Chấm điểm chuỗi cung ứng theo OpenSSF Scorecard (Pinned-Dependencies, Token-Permissions,
# Branch-Protection, Dangerous-Workflow, SAST, …) — ADR-0014, lấy từ projects-template @ 59bd1d1.
# Chỉ đọc; kết quả lên tab Security → Code scanning. `publish_results: false`: không gửi điểm ra API
# công khai của OpenSSF (muốn có huy hiệu thì đổi thành true).
on:
  schedule:
    - cron: "41 4 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload SARIF
      id-token: write # scorecard-action yêu cầu để xác thực kết quả
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
