name: QUALITY runtime prepare

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/quality-runtime-prepare.yml

permissions:
  contents: read

concurrency:
  group: quality-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/quality-runtime-guard-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Áp patch đã kiểm, đòi tree khớp bit và chỉ xuất git objects
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trimEnd();
          const root = 'https://api.github.com/repos/seeker19110/xboss';
          const branch = 'fix/quality-runtime-guard-20261006';
          const source = process.env.SOURCE_SHA;
          const baseSha = 'c838a1279359ad41e670cd33db22489858264061';
          const expectedTree = '7748ae9e559693bd788ca97dc7273c70278869ed';
          const patchSha = 'e5781b5f1e9433e1e29df6a4b36347184a6534d5';
          const workflow = '.github/workflows/quality-runtime-prepare.yml';
          const headers = {
            authorization: `Bearer ${process.env.GH_TOKEN}`,
            accept: 'application/vnd.github+json',
            'content-type': 'application/json',
            'x-github-api-version': '2022-11-28'
          };
          async function api(route, body) {
            const response = await fetch(root + route, {
              method: body ? 'POST' : 'GET', headers,
              ...(body ? { body: JSON.stringify(body) } : {})
            });
            assert.ok(response.ok, `${route}: ${response.status}`);
            return response.json();
          }
          assert.equal(git('rev-parse', 'HEAD'), source);
          git('merge-base', '--is-ancestor', baseSha, source);
          assert.equal(git('diff', '--name-only', baseSha, source), workflow);
          assert.equal((await api(`/git/ref/heads/${branch}`)).object.sha, source);
          assert.equal((await api('/git/ref/heads/main')).object.sha, baseSha);
          const patch = await api(`/git/blobs/${patchSha}`);
          assert.equal(patch.sha, patchSha);
          assert.equal(patch.encoding, 'base64');
          const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'xboss-runtime-'));
          try {
            const file = path.join(dir, 'verified.patch');
            fs.writeFileSync(file, Buffer.from(patch.content, 'base64'));
            assert.equal(git('hash-object', file), patchSha);
            git('rm', workflow);
            git('apply', '--index', '--check', file);
            git('apply', '--index', file);
            assert.equal(git('write-tree'), '6d339ca375115fe305c22aeec17f18ada8967f41');
            const title = '# PROGRESS — XBoss\n\n';
            const progress = fs.readFileSync('PROGRESS.md', 'utf8');
            assert.ok(progress.startsWith(title));
            const notice = [
              '## 2026-10-06 — Xác nhận main đã nhận PR #574', '',
              'GitHub xác nhận PR #574 đã merge tại `c838a1279359ad41e670cd33db22489858264061`',
              'ngày 06/10/2026 lúc 16:20:12 UTC; tree khớp bản tích hợp đã kiểm. Nhánh nguồn đã bị xóa.',
              'Bản bổ sung credential runtime tiếp tục từ main này, không cố ghi vào nhánh đã đóng.',
              'Chưa xác nhận deploy/production đạt chỉ từ sự kiện merge; các ghi nhận chờ nhập ở dưới là lịch sử.', '', ''
            ].join('\n');
            fs.writeFileSync('PROGRESS.md', title + notice + progress.slice(title.length));
            fs.appendFileSync('docs/ops/quality-runtime-guard-2026-10-06.md', [
              '', '## Đối chiếu main thay đổi trong phiên', '',
              'PR #574 đã được merge tại `c838a1279359ad41e670cd33db22489858264061` lúc 16:20:12 UTC.',
              'Tree main là `78a10708e31209f9c4b811f3a9c00dad161e34c6`, trùng snapshot nguồn của bản sửa này.',
              'CI push main `37494895895` được ghi nhận đang chạy ở lần đối chiếu; chưa dùng làm bằng chứng PASS.',
              'Nhánh nguồn #574 đã xóa nên PR bổ sung chuyển sang base main, không khôi phục hoặc force nhánh cũ.',
              'Sự kiện merge không thay bằng chứng review độc lập, credential hợp lệ hoặc nghiệm thu production.', ''
            ].join('\n'));
            git('add', 'PROGRESS.md', 'docs/ops/quality-runtime-guard-2026-10-06.md');
            git('diff', '--cached', '--check', source);
            assert.equal(git('write-tree'), expectedTree, 'Tree lệch snapshot đã kiểm cục bộ');
            const changes = git('diff', '--cached', '--name-status', '--no-renames', source).split('\n');
            const tree = [];
            for (const line of changes) {
              const [status, name] = line.split('\t');
              if (status === 'D') {
                assert.equal(name, workflow);
                tree.push({ path: name, mode: '100644', type: 'blob', sha: null });
                continue;
              }
              assert.ok(['A', 'M'].includes(status));
              const mode = git('ls-files', '--stage', name).split(' ')[0];
              assert.ok(['100644', '100755'].includes(mode));
              const content = fs.readFileSync(name, 'utf8');
              assert.ok(Buffer.from(content).equals(fs.readFileSync(name)));
              const blob = await api('/git/blobs', { content, encoding: 'utf-8' });
              tree.push({ path: name, mode, type: 'blob', sha: blob.sha });
              console.log('CANDIDATE_FILE', name, blob.sha);
            }
            const base = await api(`/git/commits/${source}`);
            const candidate = await api('/git/trees', { base_tree: base.tree.sha, tree });
            assert.equal(candidate.sha, expectedTree);
            console.log('RUNTIME_CANDIDATE_TREE', candidate.sha, 'SOURCE', source);
            console.log('FULL_CI_FINAL_COMMIT_REQUIRED; NO_REF_WRITE; NO_PRODUCTION_ACCESS');
          } finally {
            fs.rmSync(dir, { recursive: true, force: true });
          }
          NODE
