name: Secret scan

# Tự động hoá luật "bí mật KHÔNG bao giờ vào Git" (CLAUDE.md / SECURITY.md).
# Trước đây chỉ dựa vào .gitignore + con người — gitleaks quét diff/commit để chặn rò rỉ.
# Miễn phí cho repo cá nhân (kể cả private) & repo public; repo tổ chức cần GITLEAKS_LICENSE.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# gitleaks-action đọc danh sách commit của PR qua API → cần quyền đọc PR.
# Thiếu quyền này gây lỗi 403 "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Lấy đủ lịch sử để quét được toàn bộ commit trong PR/push.
          fetch-depth: 0

      - name: Quét bí mật (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
