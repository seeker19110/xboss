name: QUALITY integration prepare

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/quality-integration-prepare.yml

permissions:
  contents: read

concurrency:
  group: quality-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/quality-final-integration-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Tích hợp local trên runner, dừng khi code xung đột
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { execFileSync, spawnSync } from 'node:child_process';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trimEnd();
          const main = 'a891d5aebdbda82ab268d3e86c35065e54eb1db4';
          assert.equal(git('ls-remote', 'origin', 'refs/heads/main').split('\t')[0], main);
          assert.equal(git('rev-parse', 'HEAD'), process.env.SOURCE_SHA);
          const inputs = [
            [571, '2d9991e4a7f2ea75e279459271d2580520ed6dc3'],
            [562, '567f0d4aa5f2031622e5d84807064445306f51d6'],
            [565, 'a04e6873858e6eb23dbdae58b8054d915bef28f5'],
            [567, '7cdfdf8caa93f09260de295aed272f432366ad09'],
            [568, '59be1207eace6c69331b151ba0217a2439cbbc12'],
            [566, '4f07bf3f5fcfa8af099998179c961ee5bf8ed0c5'],
            [569, 'ace034485e8c9b8f587d3f2463c8c756d1923f3e']
          ];
          git('config', 'user.name', 'github-actions[bot]');
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com');
          const allowed = new Set([
            'PROGRESS.md', 'docs/ops/quality-integration-2026-10-06.md',
            '.github/workflows/quality-integration-prepare.yml'
          ]);
          const isSubsequence = (base, other) => {
            let i = 0;
            for (const line of other.split('\n')) {
              if (line === base[i]) i++;
            }
            return i === base.length;
          };
          for (const [number, sha] of inputs) {
            assert.equal(git('ls-remote', 'origin', `refs/pull/${number}/head`).split('\t')[0], sha,
              `PR #${number} đã đổi HEAD`);
            git('fetch', 'origin', sha);
            const base = git('merge-base', main, sha);
            for (const file of git('diff', '--name-only', base, sha).split('\n')) {
              if (file) allowed.add(file);
            }
            const result = spawnSync('git', ['merge', '--no-commit', '--no-ff', sha], {
              encoding: 'utf8'
            });
            assert.ifError(result.error);
            process.stdout.write(result.stdout);
            process.stderr.write(result.stderr);
            if (result.status !== 0) {
              const conflicts = git('diff', '--name-only', '--diff-filter=U').split('\n');
              assert.deepEqual(conflicts, ['PROGRESS.md'], 'Không tự giải quyết xung đột code');
              const baseText = git('show', ':1:PROGRESS.md');
              const ours = git('show', ':2:PROGRESS.md');
              const theirs = git('show', ':3:PROGRESS.md');
              assert.ok(isSubsequence(baseText.split('\n'), ours), 'PROGRESS phía ours sửa lịch sử');
              assert.ok(isSubsequence(baseText.split('\n'), theirs), 'PROGRESS phía theirs sửa lịch sử');
              const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'xboss-progress-'));
              try {
                for (const [name, text] of [['ours', ours], ['base', baseText], ['theirs', theirs]]) {
                  fs.writeFileSync(path.join(dir, name), text + '\n');
                }
                const merged = git('merge-file', '--union', '-p', path.join(dir, 'ours'),
                  path.join(dir, 'base'), path.join(dir, 'theirs'));
                assert.ok(isSubsequence(ours.split('\n'), merged));
                assert.ok(isSubsequence(theirs.split('\n'), merged));
                fs.writeFileSync('PROGRESS.md', merged + '\n');
              } finally {
                fs.rmSync(dir, { recursive: true, force: true });
              }
              git('add', 'PROGRESS.md');
              console.log('PROGRESS_UNION_PRESERVED', number);
            }
            assert.equal(git('diff', '--name-only', '--diff-filter=U'), '');
            if (git('rev-parse', '--verify', '--quiet', 'MERGE_HEAD')) {
              git('commit', '-m', `Tích hợp local PR #${number} cho kiểm chứng, không push`);
            }
            console.log('INTEGRATED_LOCAL', number, sha);
          }
          const notePath = 'docs/ops/quality-integration-2026-10-06.md';
          assert.ok(!fs.existsSync(notePath));
          fs.writeFileSync(notePath, [
            '# QUALITY-FINAL-1 — Ứng viên tích hợp 2026-10-06', '',
            `Baseline main: \`${main}\`. Dependency từ PR #573.`, '',
            'Tích hợp thử các bản vá hiện hữu, không ghi COMPLETE hoặc RELEASE_VERIFIED.',
            'Nguồn được ghim SHA và đối chiếu refs/pull trước khi merge local trên runner:', '',
            ...inputs.map(([number, sha]) => `- PR #${number}: \`${sha}\`.`), '',
            'Giữ thứ tự #566 trước #569. Xung đột code phải dừng, không chọn ours/theirs.',
            'Chỉ PROGRESS được union nếu chứng minh hai phía chỉ thêm, giữ nguyên lịch sử.',
            'Workflow tạm bị loại khỏi tree ứng viên, không sửa main/ref hoặc production.', '',
            'Kiểm formatter/lint/typecheck và regression deploy/restore trước xuất candidate.',
            'Full CI PostgreSQL/coverage/build/E2E phải chạy lại trên commit tích hợp cuối.',
            'Review độc lập, credential migrator VPS và các AC còn lại trong #572 vẫn mở.',
            'Không bật offline, đổi global money parser hoặc tuyên bố full PITR đã đạt.', ''
          ].join('\n'));
          fs.rmSync('.github/workflows/quality-integration-prepare.yml');
          fs.writeFileSync('/tmp/xboss-integration-allowed.json', JSON.stringify([...allowed]));
          fs.writeFileSync('/tmp/xboss-integration-inputs.json', JSON.stringify(inputs));
          NODE
      - name: Cài và kiểm ứng viên trước khi lưu tree
        run: |
          npm ci --no-audit --no-fund
          npx prettier --write PROGRESS.md docs/ops/quality-integration-2026-10-06.md
          npm run format:check
          npm run lint
          npm run typecheck
          npm run check:migrations
          npm run check:sw-exclude
          bash -n deploy.sh
          bash -n scripts/restore-check.sh
          npx tsx --test tests/deploy-preflight.test.ts tests/deploy-migration-credential.test.ts tests/restore-check.test.ts
      - name: Xuất tree ứng viên, không commit hoặc sửa ref GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trimEnd();
          const root = 'https://api.github.com/repos/seeker19110/xboss';
          const headers = {
            authorization: `Bearer ${process.env.GH_TOKEN}`,
            accept: 'application/vnd.github+json',
            'content-type': 'application/json',
            'x-github-api-version': '2022-11-28'
          };
          async function api(route, body) {
            const response = await fetch(root + route, {
              method: body ? 'POST' : 'GET', headers,
              ...(body ? { body: JSON.stringify(body) } : {})
            });
            assert.ok(response.ok, `${route}: ${response.status}`);
            return response.json();
          }
          const source = process.env.SOURCE_SHA;
          assert.equal((await api('/git/ref/heads/fix/quality-final-integration-20261006')).object.sha, source);
          assert.equal((await api('/git/ref/heads/main')).object.sha,
            'a891d5aebdbda82ab268d3e86c35065e54eb1db4');
          const allowed = new Set(JSON.parse(fs.readFileSync('/tmp/xboss-integration-allowed.json')));
          git('add', '-A');
          git('diff', '--cached', '--check', source);
          const changes = git('diff', '--cached', '--name-status', '--no-renames', source).split('\n');
          const tree = [];
          for (const line of changes) {
            const [status, file] = line.split('\t');
            assert.ok(allowed.has(file), `Ngoài phạm vi: ${file}`);
            if (status === 'D') {
              assert.equal(file, '.github/workflows/quality-integration-prepare.yml');
              tree.push({ path: file, mode: '100644', type: 'blob', sha: null });
              continue;
            }
            assert.ok(['A', 'M'].includes(status));
            const mode = git('ls-files', '--stage', file).split(' ')[0];
            assert.ok(['100644', '100755'].includes(mode));
            const content = fs.readFileSync(file, 'utf8');
            assert.ok(Buffer.from(content).equals(fs.readFileSync(file)), 'Chỉ ghi file UTF-8');
            const blob = await api('/git/blobs', { content, encoding: 'utf-8' });
            tree.push({ path: file, mode, type: 'blob', sha: blob.sha });
            console.log('CANDIDATE_FILE', file, blob.sha);
          }
          const base = await api(`/git/commits/${source}`);
          const result = await api('/git/trees', { base_tree: base.tree.sha, tree });
          console.log('INTEGRATION_CANDIDATE_TREE', result.sha, 'SOURCE', source);
          console.log('PARENTS', fs.readFileSync('/tmp/xboss-integration-inputs.json', 'utf8'));
          NODE
