name: E2E

# Kiểm thử đầu-cuối (Playwright) trên desktop + mobile.
#  - Nhánh công khai: smoke + axe trang /login (không cần CSDL).
#  - Nhánh sau đăng nhập: axe a11y các trang sau auth (Dashboard…) — cần DB test.
#    Project `setup` đăng nhập 1 lần (admin) lưu storageState; global-setup seed dữ liệu mẫu.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: workflow chỉ cần đọc code, không cần ghi gì lên GitHub.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    # Postgres test cho nhánh sau-auth (seed dữ liệu mẫu + tạo admin khi login).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: xboss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # E2E_DATABASE_URL bật nhánh sau-auth (mirror quy ước TEST_DATABASE_URL của test tích hợp).
      E2E_DATABASE_URL: postgres://ci:ci@localhost:5432/xboss_test
      # DATABASE_URL cho bước build (pool lazy — chỉ cần biến tồn tại).
      DATABASE_URL: postgres://ci:ci@localhost:5432/xboss_test
      # Secret ký phiên (production) + mật khẩu admin tạo lần đầu — giá trị test, DB ephemeral.
      # gitleaks:allow — không phải secret thật (biến tên có "SECRET" nên generic-api-key báo nhầm).
      XBOSS_SECRET: e2e-ci-secret-khong-bi-mat # gitleaks:allow
      XBOSS_ADMIN_PASSWORD: e2e-ci-admin-pw # gitleaks:allow

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Cài trình duyệt Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Chạy E2E (desktop + mobile, gồm nhánh sau đăng nhập)
        run: npm run test:e2e

      - name: Lưu báo cáo khi lỗi
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
