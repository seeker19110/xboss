name: E2E

# Kiểm thử đầu-cuối (Playwright) trên desktop + mobile.
# Hiện smoke + a11y trang /login (không cần CSDL — pool lazy, DATABASE_URL giả).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      # App khởi động không cần DB thật (pool lazy); /login render hoàn toàn client.
      DATABASE_URL: postgres://x:x@127.0.0.1:5432/x
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Cài trình duyệt Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Chạy E2E (desktop + mobile)
        run: npm run test:e2e

      - name: Lưu báo cáo khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
