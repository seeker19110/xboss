name: Temporary Prettier Diff

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prettier-output:
    if: github.event.pull_request.head.ref == 'feat/ui-ux-pro-max-integration'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Format and print exact outputs
        shell: bash
        run: |
          files=(
            ".agents/skills/ui-ux-craftsman/SKILL.md"
            "docs/integration/UI_UX_PRO_MAX_MAPPING.md"
            "docs/nang-cap/UX01-ui-ux-pro-max-integration.md"
          )
          npx --no-install prettier --write "${files[@]}"
          for file in "${files[@]}"; do
            echo "PRETTIER_FILE_BEGIN:${file}"
            base64 -w0 "${file}"
            echo
            echo "PRETTIER_FILE_END:${file}"
          done
