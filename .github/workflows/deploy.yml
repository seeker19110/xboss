name: Deploy to VPS

# Deploy ngay khi có push lên main — không chờ workflow CI chạy lại lần nữa. CI đã chặn ở
# bước merge PR (branch protection yêu cầu check "CI" pass trước khi cho merge), nên code
# trên main tại thời điểm này đã qua lint/typecheck/test/build rồi, chờ thêm là dư thừa.
on:
  push:
    branches: [main]

# 2 push liên tiếp trong lúc build trước chưa xong từng làm deploy sau đá deploy trước
# ("Another next build process is already running", build tạm dùng chung thư mục
# .next-build trên VPS) — không mất code (lượt sau luôn git reset --hard origin/main
# nên tự lấy đúng bản mới nhất) nhưng để lại dấu đỏ giả trong Actions. Xếp hàng tuần tự
# thay vì đá nhau; không cancel-in-progress vì huỷ giữa chừng lúc SSH đang chạy deploy.sh
# trên VPS thật có thể để lại trạng thái dở dang (migration/build/pm2 restart).
concurrency:
  group: deploy-main
  cancel-in-progress: false

# Job chỉ SSH vào VPS bằng secrets riêng — không cần bất kỳ quyền GITHUB_TOKEN nào
# (least-privilege theo docs/audit.md §6).
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -e
            cd /var/www/xboss
            bash deploy.sh
