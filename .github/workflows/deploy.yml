name: Deploy to VPS

# Deploy ngay khi có push lên main — không chờ workflow CI chạy lại lần nữa. CI đã chặn ở
# bước merge PR (branch protection yêu cầu check "CI" pass trước khi cho merge), nên code
# trên main tại thời điểm này đã qua lint/typecheck/test/build rồi, chờ thêm là dư thừa.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -e
            cd /var/www/xboss
            bash deploy.sh
