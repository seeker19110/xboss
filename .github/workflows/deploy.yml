name: Deploy to VPS

# Deploy khi workflow CI trên main hoàn tất VÀ pass — loại bỏ phụ thuộc ngầm vào
# branch-protection setting ngoài repo.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# 2 push liên tiếp trong lúc build trước chưa xong từng làm deploy sau đá deploy trước
# ("Another next build process is already running", build tạm dùng chung thư mục
# .next-build trên VPS) — không mất code (lượt sau luôn git reset --hard origin/main
# nên tự lấy đúng bản mới nhất) nhưng để lại dấu đỏ giả trong Actions. Xếp hàng tuần tự
# thay vì đá nhau; không cancel-in-progress vì huỷ giữa chừng lúc SSH đang chạy deploy.sh
# trên VPS thật có thể để lại trạng thái dở dang (migration/build/pm2 restart).
concurrency:
  group: deploy-main
  cancel-in-progress: false

# Chỉ cần đọc code để checkout đúng commit đã qua CI. Không cần quyền ghi nào
# (least-privilege theo docs/audit.md §6) — thao tác trên VPS đi bằng SSH key riêng.
permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      # Đường dẫn app trên VPS. Runner build NGAY TẠI đường dẫn này (xem bước bên dưới) —
      # không phải chuyện làm cho đẹp: `.next` có nhúng đường dẫn tuyệt đối của lúc build
      # (required-server-files.json, các file trace *.nft.json). Build ở /home/runner/... rồi
      # chạy ở /var/www/xboss là một lớp lệch âm thầm không đáng phải gánh.
      APP_DIR: /var/www/xboss
    steps:
      # Checkout ĐÚNG commit đã chạy CI, không phải HEAD của main lúc job này khởi động:
      # hai push sát nhau sẽ khiến bản build lệch với commit mà deploy.sh reset về trên VPS
      # (deploy.sh có cổng đối chiếu SHA, sẽ dừng deploy — nhưng tốt nhất là đừng tạo ra
      # tình huống đó ngay từ đầu).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Dựng thư mục build khớp đường dẫn production
        run: |
          set -e
          sudo mkdir -p "$APP_DIR"
          sudo chown -R "$USER" "$(dirname "$APP_DIR")"
          rsync -a --delete "$GITHUB_WORKSPACE/" "$APP_DIR/"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cài dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      # ── Build ở runner, KHÔNG build trên VPS ──────────────────────────────
      # Lý do (PROGRESS.md 2026-07-19): `next build` trên VPS chạy 20-23 phút vì RAM thiếu
      # phải bù bằng swap đĩa, có lúc bị OOM-kill (exit 137), có lúc vượt command_timeout
      # của ssh-action và bị cắt ngang đúng lúc build vừa xong ⇒ commit mới nhất không lên
      # được production. Runner GitHub có RAM/CPU dư nên build vài phút; VPS chỉ còn việc
      # nhận file, áp migration, swap và reload.
      - name: Build production (thư mục .next-ci)
        working-directory: ${{ env.APP_DIR }}
        run: NEXT_DIST_DIR=.next-ci npm run build
        env:
          # Build không kết nối DB (Pool khởi tạo lazy) — chỉ cần biến tồn tại.
          DATABASE_URL: postgres://ci:ci@localhost:5432/xboss_build
          # BIẾN NÀY ĐƯỢC NHÚNG VÀO BUNDLE LÚC BUILD, không đọc lúc chạy: trước đây build
          # diễn ra trên VPS nên nó lấy từ .env.local ở đó. Build ở runner mà không truyền
          # vào thì Sentry phía TRÌNH DUYỆT tự tắt (SDK no-op) — hỏng âm thầm, không có lỗi.
          # Khai secret cùng tên trong repo nếu đang dùng Sentry client; bỏ trống thì hành vi
          # đúng như khi VPS không đặt biến. Sentry phía server đọc SENTRY_DSN lúc chạy nên
          # không bị ảnh hưởng.
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

      # Kèm phiếu thông tin để deploy.sh kiểm chéo trước khi swap: SHA phải khớp commit VPS
      # reset về (chống deploy nhầm bản build của commit khác) và Node major phải khớp bản
      # trên VPS (lệch major = nguy cơ lệch native module/runtime, DEPLOY.md mục "Build ở
      # máy khác" đã nêu điều kiện này).
      - name: Đóng gói bản build
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          {
            echo "sha=${{ github.event.workflow_run.head_sha }}"
            echo "node=$(node -p 'process.versions.node.split(".")[0]')"
          } > .next-ci.info
          tar -czf .next-ci.tar.gz .next-ci .next-ci.info
          ls -lh .next-ci.tar.gz

      - name: Chuẩn bị SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Fail-closed: bắt buộc host key VPS đã ghim qua kênh tin cậy. Không ssh-keyscan
          # (tin lần đầu) vì kẻ chặn đường giả VPS được sẽ nhận artifact + lệnh deploy.
          if [ -z "$VPS_SSH_KNOWN_HOSTS" ]; then
            echo "::error::Thiếu secret VPS_SSH_KNOWN_HOSTS — dừng deploy trước mọi kết nối SSH. Lấy host key qua kênh tin cậy (console nhà cung cấp VPS: ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub), đối chiếu với host key quét từ máy bạn rồi dán dòng known_hosts vào secret. Xem DEPLOY.md."
            exit 1
          fi
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Secret phải chứa ít nhất một dòng khớp đúng host đang deploy (cổng SSH mặc định 22).
          if ! ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error::VPS_SSH_KNOWN_HOSTS không có dòng nào khớp host VPS_HOST — kiểm tra lại nội dung secret."
            exit 1
          fi

      - name: Gửi bản build sang VPS
        working-directory: ${{ env.APP_DIR }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -e
          # Gửi vào tên tạm rồi đổi tên trên VPS: deploy.sh chỉ thấy ".next-ci.tar.gz" khi
          # file đã sang trọn vẹn, không bao giờ đọc phải gói còn dở nếu mạng đứt giữa chừng.
          rsync -az --timeout=120 -e "ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            .next-ci.tar.gz "$VPS_USER@$VPS_HOST:$APP_DIR/.next-ci.tar.gz.part"
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "mv '$APP_DIR/.next-ci.tar.gz.part' '$APP_DIR/.next-ci.tar.gz'"

      - name: Chạy deploy trên VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -e
          # Chạy script từ đúng commit đã qua CI, không dùng bản deploy.sh còn sót ở checkout cũ.
          # SHA chỉ nhận dạng hex trước khi đưa vào chuỗi lệnh SSH; không có secret trong lệnh.
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "DEPLOY_SHA không hợp lệ." >&2
            exit 1
          fi
          # Đọc script đã ghim vào file tạm ngoài checkout; chưa reset khi preflight chưa đạt.
          # Trap dọn cả khi git show/script lỗi; không dùng pipeline che mất exit code của git.
          REMOTE_COMMAND="cd '$APP_DIR' && git fetch origin '$DEPLOY_SHA' && deploy_script=\$(mktemp /tmp/xboss-deploy.XXXXXX) && trap 'rm -f \"\$deploy_script\"' EXIT && git show '$DEPLOY_SHA:deploy.sh' > \"\$deploy_script\" && EXPECTED_DEPLOY_SHA='$DEPLOY_SHA' bash \"\$deploy_script\""
          # Không còn build trên VPS nên các bước còn lại (npm ci, migrate, swap, reload,
          # health-check) chỉ mất vài phút — 15m là dư, không cần 40m như trước.
          timeout 15m ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$VPS_USER@$VPS_HOST" "$REMOTE_COMMAND"

      - name: Dọn khoá SSH
        if: always()
        run: rm -f ~/.ssh/id_deploy
