name: Deploy to VPS
run-name: VPS production · CI ${{ github.event.workflow_run.id }} · ${{ github.event.workflow_run.head_sha }}

# Deploy khi CI của main đạt và reviewer duyệt environment Production.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# 2 push liên tiếp trong lúc build trước chưa xong từng làm deploy sau đá deploy trước
# ("Another next build process is already running", build tạm dùng chung thư mục
# .next-build trên VPS) — không mất code (lượt sau luôn git reset --hard origin/main
# nên tự lấy đúng bản mới nhất) nhưng để lại dấu đỏ giả trong Actions. Xếp hàng tuần tự
# thay vì đá nhau; không cancel-in-progress vì huỷ giữa chừng lúc SSH đang chạy deploy.sh
# trên VPS thật có thể để lại trạng thái dở dang (migration/build/pm2 restart).
concurrency:
  group: deploy-main
  cancel-in-progress: false

# Đọc mã của workflow và artifact của CI. Thao tác trên VPS dùng SSH key riêng.
permissions:
  contents: read
  actions: read

jobs:
  deploy:
    # AUD-CI-001: chỉ deploy CI chạy do PUSH lên main CỦA CHÍNH repo này. Thiếu 2 điều kiện
    # cuối thì PR từ fork có nhánh tên "main" (CI chạy theo pull_request) cũng kích hoạt job
    # này trong ngữ cảnh repo gốc — đủ secret VPS — và checkout/chạy mã của fork.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: Production
    env:
      APP_DIR: /var/www/xboss
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      # Dùng công cụ kiểm của chính phiên bản workflow. VPS lấy deploy.sh từ SOURCE_SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Xác định artifact từ đúng run và attempt của CI main
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CI_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          name="xboss-vps-$CI_RUN_ID-$CI_RUN_ATTEMPT-$SOURCE_SHA"
          artifact=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/artifacts" \
            -f name="$name" | jq -ce --arg name "$name" --arg sha "$SOURCE_SHA" \
            --arg run "$CI_RUN_ID" --arg repo "$GITHUB_REPOSITORY_ID" '
              [.artifacts[] | select(.name == $name and .expired == false)]
              | select(length == 1) | .[0]
              | select((.id | tostring | test("^[1-9][0-9]*$")) and
                  (.digest | test("^sha256:[0-9a-f]{64}$")) and
                  (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $sha and
                  .workflow_run.head_branch == "main" and (.workflow_run.repository_id | tostring) == $repo and
                  (.workflow_run.head_repository_id | tostring) == $repo)
            ') || {
              echo "::error::Thiếu artifact hợp lệ cho CI run/attempt này. Nếu vừa chạy lại các job lỗi, hãy chạy lại toàn bộ CI."
              exit 1
            }
          printf 'artifact-id=%s\nartifact-digest=%s\n' \
            "$(jq -r .id <<<"$artifact")" "$(jq -r .digest <<<"$artifact")" >> "$GITHUB_OUTPUT"

      - name: Tải artifact của CI và kiểm digest GitHub
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          artifact-ids: ${{ steps.resolve.outputs.artifact-id }}
          path: ${{ runner.temp }}/xboss-vps-artifact
          digest-mismatch: error

      - name: Kiểm SHA-256 archive, metadata và Build ID
        id: verify
        run: |
          metadata="$RUNNER_TEMP/xboss-vps-verified.json"
          node scripts/ops/vps-artifact.mjs verify "$RUNNER_TEMP/xboss-vps-artifact" \
            "$GITHUB_REPOSITORY" "$SOURCE_SHA" "$CI_RUN_ID" "$CI_RUN_ATTEMPT" > "$metadata"
          archive_sha=$(jq -er '.archive_sha256 | select(test("^[0-9a-f]{64}$"))' "$metadata")
          printf 'archive-sha256=%s\n' "$archive_sha" >> "$GITHUB_OUTPUT"

      - name: Chuẩn bị SSH
        id: ssh
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          # Host key là dữ liệu công khai: nhận cả repository secret lẫn Actions variable.
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS || vars.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Fail-closed: bắt buộc host key VPS đã ghim qua kênh tin cậy. Không ssh-keyscan
          # (tin lần đầu) vì kẻ chặn đường giả VPS được sẽ nhận artifact + lệnh deploy.
          if [ -z "$VPS_SSH_KNOWN_HOSTS" ]; then
            echo "::error::Thiếu VPS_SSH_KNOWN_HOSTS (repository secret hoặc Actions variable) — dừng deploy trước mọi kết nối SSH. Lấy host key qua kênh tin cậy (console nhà cung cấp VPS: ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub), đối chiếu với host key quét từ máy bạn rồi dán dòng known_hosts vào secret hoặc variable. Xem DEPLOY.md."
            exit 1
          fi
          # Chuẩn hoá: nhận cả khoá trần `ssh-ed25519 AAAA...`, dòng known_hosts gắn tên khác
          # VPS_HOST (domain ↔ IP), CRLF — gắn nhãn lại = VPS_HOST; khoá ghim giữ nguyên.
          bash scripts/ops/chuan-hoa-known-hosts.sh "$VPS_HOST" <<<"$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Phải còn ít nhất một khoá hợp lệ khớp đúng host đang deploy (cổng SSH mặc định 22).
          if ! ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts > /dev/null || ! ssh-keygen -lf ~/.ssh/known_hosts > /dev/null; then
            echo "::error::VPS_SSH_KNOWN_HOSTS không chứa khoá công khai SSH hợp lệ nào — cần nguyên khoá dạng 'ssh-ed25519 AAAA...' (nội dung /etc/ssh/ssh_host_ed25519_key.pub, có thể kèm host phía trước), không phải fingerprint SHA256:...; kiểm tra lại secret/variable."
            exit 1
          fi

      - name: Gửi bản build sang VPS
        id: transfer
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          ARCHIVE_SHA: ${{ steps.verify.outputs.archive-sha256 }}
        run: |
          [[ "$ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          # Chỉ đổi tên khi SHA-256 của gói tạm trên VPS khớp gói CI đã xác minh.
          rsync -az --timeout=120 -e "ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            "$RUNNER_TEMP/xboss-vps-artifact/xboss-vps.tar.gz" \
            "$VPS_USER@$VPS_HOST:$APP_DIR/.next-ci.tar.gz.part"
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "cd '$APP_DIR' && printf '%s  %s\n' '$ARCHIVE_SHA' '.next-ci.tar.gz.part' | sha256sum --check && mv .next-ci.tar.gz.part .next-ci.tar.gz"

      - name: Chạy deploy trên VPS
        id: deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          ARCHIVE_SHA: ${{ steps.verify.outputs.archive-sha256 }}
        run: |
          set -e
          # Chạy script từ đúng commit đã qua CI, không dùng bản deploy.sh còn sót ở checkout cũ.
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "SOURCE_SHA không hợp lệ." >&2; exit 1; }
          [[ "$ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "ARCHIVE_SHA không hợp lệ." >&2; exit 1; }
          # Kiểm lại archive cuối ngay trước deploy.sh để lỗi checksum dừng trước migration.
          REMOTE_COMMAND="cd '$APP_DIR' && git fetch origin '$SOURCE_SHA' && deploy_script=\$(mktemp /tmp/xboss-deploy.XXXXXX) && trap 'rm -f \"\$deploy_script\"' EXIT && git show '$SOURCE_SHA:deploy.sh' > \"\$deploy_script\" && printf '%s  %s\n' '$ARCHIVE_SHA' '.next-ci.tar.gz' | sha256sum --check && EXPECTED_DEPLOY_SHA='$SOURCE_SHA' bash \"\$deploy_script\""
          # Không còn build trên VPS nên các bước còn lại (npm ci, migrate, swap, reload,
          # health-check) chỉ mất vài phút — 15m là dư, không cần 40m như trước.
          timeout 15m ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$VPS_USER@$VPS_HOST" "$REMOTE_COMMAND"

      - name: Xác minh Build ID production và ghi biên nhận
        if: always()
        env:
          CI_ARTIFACT_ID: ${{ steps.resolve.outputs.artifact-id }}
          CI_ARTIFACT_DIGEST: ${{ steps.resolve.outputs.artifact-digest }}
          RESOLVE_OUTCOME: ${{ steps.resolve.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          TRANSFER_OUTCOME: ${{ steps.ssh.outcome == 'success' && steps.transfer.outcome || steps.ssh.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          receipt="$RUNNER_TEMP/xboss-vps-receipt/receipt.json"
          mkdir -p "$(dirname "$receipt")"
          if [ -f scripts/ops/vps-production-receipt.mjs ] && command -v node >/dev/null; then
            node scripts/ops/vps-production-receipt.mjs "$RUNNER_TEMP/xboss-vps-verified.json" "$receipt"
          else
            jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" \
              --arg ci "$CI_RUN_ID" --arg ci_attempt "$CI_RUN_ATTEMPT" \
              --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
              '{schema: 1, status: "failed", failed_phase: "setup", deployment_activated: false,
                repository: $repo, source_sha: $sha, ci_run_id: $ci, ci_run_attempt: $ci_attempt,
                deploy_run_id: $run, deploy_run_attempt: $attempt, observed_at: (now | todateiso8601)}' > "$receipt"
            exit 1
          fi

      - name: Dọn khoá SSH
        if: always()
        run: rm -f ~/.ssh/id_deploy

      - name: Lưu biên nhận deploy VPS
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xboss-vps-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xboss-vps-receipt/receipt.json
          if-no-files-found: error
          retention-days: 30
