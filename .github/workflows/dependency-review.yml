name: Dependency review

# Chặn PR thêm/nâng dependency có lỗ hổng mức high trở lên NGAY trên diff của PR (ADR-0014, lấy từ
# projects-template @ 59bd1d1). Bổ sung cho bước `npm audit` của ci.yml: audit quét toàn bộ cây hiện
# có, còn dependency-review chỉ xét gói mà PR này đưa vào — báo đúng PR gây ra, kể cả lockfile.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
