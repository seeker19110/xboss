name: Docker Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    name: Build & Verify Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tự động đăng nhập GHCR nếu là push vào main (dùng token GitHub Actions sẵn có)
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & Cache cho Web App Next.js (xboss)
      - name: Build XBoss App Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/xboss:latest
            ghcr.io/${{ github.repository }}/xboss:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Cache cho MEPF Worker Daemon
      - name: Build MEPF Worker Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.mepf-worker
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/mepf-worker:latest
            ghcr.io/${{ github.repository }}/mepf-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
