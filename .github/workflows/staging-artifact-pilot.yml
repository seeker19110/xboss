name: Staging artifact pilot

on:
  push:
    branches: [ci/staging-artifact-pilot]
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read

env:
  XT_PILOT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build immutable pilot archive
    if: >-
      github.repository == 'seeker19110/xboss' &&
      (github.event_name == 'push' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
         github.event.pull_request.head.ref == 'ci/staging-artifact-pilot'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      metadata-sha256: ${{ steps.package.outputs.metadata-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.XT_PILOT_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Verify checkout and install pinned dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$XT_PILOT_SOURCE_SHA"
          npm ci
      - name: Test artifact verifier
        run: node --test tests/artifact-pilot.test.ts
      - name: Build and package once
        id: package
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/xboss_pilot
          NEXT_DIST_DIR: .next-ci
        run: |
          npm run build
          mkdir "$RUNNER_TEMP/candidate"
          node scripts/ops/artifact-pilot.mjs pack "$PWD" "$XT_PILOT_SOURCE_SHA" \
            "$RUNNER_TEMP/candidate/xboss.tar.gz" "$RUNNER_TEMP/candidate/metadata.json"
          metadata_sha=$(sha256sum "$RUNNER_TEMP/candidate/metadata.json" | cut -d ' ' -f 1)
          printf 'metadata-sha256=%s\n' "$metadata_sha" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xboss-staging-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  staging:
    name: Install and verify running staging artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: xboss_pilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/xboss_pilot
      MIGRATE_DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/xboss_pilot
      NEXT_DIST_DIR: .next-ci
      XT_PILOT_ENVIRONMENT: staging-isolated
      XT_PILOT_DEPLOYMENT_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.XT_PILOT_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/candidate
      - name: Verify transferred metadata and install archive
        env:
          METADATA_SHA: ${{ needs.build.outputs.metadata-sha256 }}
        run: |
          test "$(git rev-parse HEAD)" = "$XT_PILOT_SOURCE_SHA"
          candidate="$RUNNER_TEMP/candidate"
          printf '%s  %s\n' "$METADATA_SHA" "$candidate/metadata.json" | sha256sum --check --status
          jq -e --arg sha "$XT_PILOT_SOURCE_SHA" '.source_sha == $sha' "$candidate/metadata.json" >/dev/null
          mkdir "$RUNNER_TEMP/installed"
          node scripts/ops/artifact-pilot.mjs install \
            "$candidate/xboss.tar.gz" "$candidate/metadata.json" "$RUNNER_TEMP/installed"
      - name: Prepare synthetic staging database and runtime
        run: |
          npm ci
          npm run db:migrate
          cp package.json next.config.mjs "$RUNNER_TEMP/installed/"
          cp -a migrations "$RUNNER_TEMP/installed/migrations"
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/installed/node_modules"
      - name: Verify installed and served artifact
        run: |
          release="$RUNNER_TEMP/installed"
          candidate="$RUNNER_TEMP/candidate"
          export XBOSS_SECRET
          XBOSS_SECRET=$(openssl rand -hex 32)
          base_url=http://127.0.0.1:3001
          export PORT=3001 APP_URL="$base_url"
          (
            cd "$release"
            unset MIGRATE_DATABASE_URL
            exec node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3001
          ) > "$RUNNER_TEMP/xboss-staging.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            kill -0 "$app_pid" 2>/dev/null || break
            curl --fail --silent --max-time 1 --output /dev/null "$base_url/api/ready" && break
            sleep 1
          done
          node scripts/ops/artifact-pilot.mjs verify "$candidate/xboss.tar.gz" \
            "$candidate/metadata.json" "$release" "$base_url" "$RUNNER_TEMP/receipt.json"
      - name: Publish staging evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xboss-staging-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/receipt.json
            ${{ runner.temp }}/candidate/metadata.json
            ${{ runner.temp }}/xboss-staging.log
          if-no-files-found: ignore
          retention-days: 30
