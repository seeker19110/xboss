# Cấu hình gitleaks — mở rộng bộ mặc định, thêm allowlist cho secret TEST của E2E.
# Các giá trị này chỉ dùng cho DB ephemeral trong CI/local, KHÔNG phải bí mật thật.
# Biến tên chứa "SECRET" khiến rule generic-api-key báo nhầm (xem .github/workflows/e2e.yml).
# Allowlist theo giá trị secret nên áp dụng cho MỌI commit (inline `gitleaks:allow` chỉ
# che được commit chứa comment, không che commit gốc đã introduce).

[extend]
useDefault = true

[allowlist]
description = "Secret/mật khẩu test cho E2E (DB ephemeral, không phải bí mật thật)"
regexes = [
  '''e2e-ci-secret-khong-bi-mat''',
  '''e2e-ci-admin-pw''',
  '''thirtytwocharacterssecret1234567''',
  # tests/log.test.ts (C4 §6 — redact log) — JWT mẫu công khai của jwt.io dùng làm fixture
  # kiểm redaction, không phải bí mật thật; rule "jwt" của gitleaks báo nhầm vì đúng cấu trúc.
  '''SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c''',
  # tests/route-auth.test.ts — mật khẩu của tài khoản test dựng trong DB ephemeral để kiểm
  # đường đăng nhập thật (sai/đúng mật khẩu, rate-limit, đổi mật khẩu vô hiệu phiên cũ).
  # Không phải bí mật thật; rule generic-api-key báo nhầm vì nằm cạnh trường "password".
  '''mk-test-xboss-khong-bi-mat''',
  '''mk-test-xboss-doi-moi''',
  '''mk-test-xboss-sai''',
  # Giá trị của bản nháp ĐẦU của cùng file test, vẫn nằm trong lịch sử commit của nhánh.
  # gitleaks quét cả lịch sử nên allowlist phải phủ chúng, đúng như ghi chú ở đầu file này.
  '''mat-khau-dung-123''',
  '''mat-khau-cu-123''',
  '''mat-khau-moi-456''',
  '''sai-mat-khau''',
]
